name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # El builder se descarga antes de aplicar su configuración de mirrors.
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Prioriza la caché pública de Google para las imágenes base de Docker Hub.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Construir etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Ejecutar tests y quality gate del backend
        run: |
          mkdir -p backend/coverage
          docker run --rm \
            -v "${{ github.workspace }}/backend/coverage:/reports" \
            backend-test:ci

      - name: Publicar resumen de cobertura del backend
        if: ${{ !cancelled() }}
        run: |
          report=backend/coverage/summary.md
          test -s "$report" || { echo "No se generó el resumen de cobertura del backend." >&2; exit 1; }
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/navarrolorenzo/ingsoft3-tp01-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/NavarroLorenzo/ingsoft3-tp01
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # El builder se descarga antes de aplicar su configuración de mirrors.
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Prioriza la caché pública de Google para las imágenes base de Docker Hub.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Construir etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Ejecutar tests y quality gate del frontend
        run: |
          mkdir -p frontend/coverage
          docker run --rm \
            -v "${{ github.workspace }}/frontend/coverage:/app/coverage" \
            frontend-test:ci

      - name: Publicar resumen de cobertura del frontend
        if: ${{ !cancelled() }}
        run: |
          report=frontend/coverage/report/coverage-summary.json
          test -s "$report" || { echo "No se generó el resumen de cobertura del frontend." >&2; exit 1; }
          node frontend/scripts/coverage-summary.cjs "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/navarrolorenzo/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/NavarroLorenzo/ingsoft3-tp01
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA las imágenes verificadas
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/navarrolorenzo/ingsoft3-tp01-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/navarrolorenzo/ingsoft3-tp01-frontend:sha-${{ github.sha }}
        run: |
          echo "Imagen backend: $IMG_API"
          echo "Imagen frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Comprobar API, base de datos y frontend de QA
        shell: bash
        env:
          URL_API: https://ingsoft3-api-qa.onrender.com
          URL_FRONT: https://ingsoft3-front-qa.onrender.com
        run: |
          echo "Esperando a que QA responda..."
          for i in $(seq 1 30); do
            # /health hace ping a PostgreSQL. /api/categorias exige sesión:
            # 401 confirma que el proxy del frontend llegó al backend.
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL_FRONT/api/categorias") \
               && [ "$status" = 401 ]; then
              echo "QA responde: API, base de datos y proxy del frontend"
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondió correctamente a tiempo"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD las imágenes aprobadas
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/navarrolorenzo/ingsoft3-tp01-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/navarrolorenzo/ingsoft3-tp01-frontend:sha-${{ github.sha }}
        run: |
          echo "Imagen backend: $IMG_API"
          echo "Imagen frontend: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Comprobar API, base de datos y frontend de PROD
        shell: bash
        env:
          URL_API: https://ingsoft3-api-prod.onrender.com
          URL_FRONT: https://ingsoft3-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD responda..."
          for i in $(seq 1 30); do
            # /health hace ping a PostgreSQL. /api/categorias exige sesión:
            # 401 confirma que el proxy del frontend llegó al backend.
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL_FRONT/api/categorias") \
               && [ "$status" = 401 ]; then
              echo "PROD responde: API, base de datos y proxy del frontend"
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondió correctamente a tiempo"
          exit 1
