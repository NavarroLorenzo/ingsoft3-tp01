# Dependabot lee este archivo cuando llega a main; el archivo local no activa los PR.
version: 2
updates:
  # Nuestro backend usa módulos de Go, en lugar de NuGet como el ejemplo de la guía.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Revisa las dependencias de React/Vite y su package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Las actions del pipeline también son dependencias y se revisan desde la raíz.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
